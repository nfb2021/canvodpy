name: Test with coverage

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

permissions: read-all

jobs:
    test_coverage:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install uv and set the python version
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  python-version: '3.14'
                  enable-cache: true

            - name: Set up Python
              run: uv python install

            - name: Update lock file (Dependabot only)
              if: github.actor == 'dependabot[bot]'
              run: uv lock
            - name: Install the Project
              # --group optional pulls in healpy (canvod-grids' HEALPix grid
              # builder) so HEALPix-dependent tests actually run in CI
              # instead of silently skipping.
              run: uv sync --locked --dev --group optional

            - name: Run Tests with Coverage
              run: uv run pytest

            - name: Upload to Coveralls
              uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
              with:
                  file: coverage.lcov

            - name: Coverage comment
              id: coverage_comment
              uses: py-cov-action/python-coverage-comment-action@df46427f7dd5d7798834fed9669de6bfb7a00628 # v3
              with:
                  GITHUB_TOKEN: ${{ github.token }}
                  VERBOSE: false
