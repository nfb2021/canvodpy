# =============================================================================
# canVODpy naming recipe template
# =============================================================================
# A recipe maps arbitrary receiver filenames to the canonical
# {SIT}{T}{NN}{AGC}_R_{YYYY}{DOY}{HHMM}_{PERIOD}_{SAMPLING}_{CONTENT}.{TYPE}
# convention, without renaming anything on disk. Only needed if your receiver
# outputs non-canonical filenames (see docs/guides/configuration.md,
# "Optional: non-canonical filenames").
#
# `just naming-init <name>` copies this template to config/recipes/<name>.yaml.
# Fill in the canonical identity below, then describe how to extract
# date/time fields from YOUR filenames in the `fields:` list.

name: CHANGEME               # must match the filename this file is saved as
description: ""

# -----------------------------------------------------------------------
# Canonical identity — how this receiver's files should be named
# -----------------------------------------------------------------------
site: CHANGEME                # 3-4 char site code, e.g. ROS
agency: CHANGEME               # 3 char agency code, e.g. TUW
receiver_number: 1             # 1-99
receiver_type: reference        # reference or canopy
sampling: "05S"                 # duration code: e.g. 01S, 05S, 15S, 30S
period: "15M"                    # duration code: e.g. 15M, 01H, 01D
content: AA                       # content code (AA = default/all observables)
file_type: rnx                     # rnx, sbf, ubx, or nmea

# -----------------------------------------------------------------------
# Directory layout and file discovery
# -----------------------------------------------------------------------
layout: yyddd_subdirs          # see canvod.virtualiconvname.config_models.DirectoryLayout
glob: "*.??o"                    # glob pattern matching this receiver's files

# -----------------------------------------------------------------------
# Field extraction — sequential left-to-right walk over the filename
# -----------------------------------------------------------------------
# Each entry consumes N characters and either extracts a named value or
# skips literal characters. Recognized field names:
#   year         4-digit year (e.g. 2025)
#   yy           2-digit year (80-99 -> 19xx, 00-79 -> 20xx)
#   doy          day of year (1-366)
#   month, day   calendar month/day (used together instead of doy)
#   hour         hour (00-23)
#   minute       minute (00-59)
#   hour_letter  RINEX hour code (a-x, single char) — used instead of hour
#   skip         ignore these characters
#
# Example 1 — RINEX-style short name: rref001a15.25o
#   station "rref", doy "001", hour_letter "a", minute "15", ext "25o"
# fields:
#   - skip: 4
#   - doy: 3
#   - hour_letter: 1
#   - minute: 2
#   - skip: 1
#   - yy: 2
#   - skip: 1
#
# Example 2 — exotic filename: STATION_2025_042_00_15.rinex
#   fields:
#   - skip: 8
#   - year: 4
#   - skip: 1
#   - doy: 3
#   - skip: 1
#   - hour: 2
#   - skip: 1
#   - minute: 2
#   - skip: 6

fields:
  - skip: 0   # CHANGEME: replace with your filename's actual field spec
